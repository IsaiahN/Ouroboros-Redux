<svg xmlns="http://www.w3.org/2000/svg" width="2600" height="1358" viewBox="0 0 2600 1358" font-family="DejaVu Sans"><rect width="2600" height="1358" fill="#ffffff"/>
<text x="200" y="62" font-size="21" fill="#8a8a80" font-weight="600" letter-spacing="3.5">FIGURE 7</text>
<text x="200" y="120" font-size="46" fill="#111111" font-weight="700">The Room Chain</text>
<text x="200" y="164" font-size="25" fill="#5f5f5f">Handing a question along, and what makes the handoff progress rather than motion.</text>
<line x1="200" y1="196" x2="2400" y2="196" stroke="#111111" stroke-width="3"/>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#3a3a3a"/></marker><marker id="arG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0f6b4a"/></marker><marker id="arB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5b5bd6"/></marker></defs>
<text x="460" y="296" text-anchor="middle" font-size="30" fill="#1a1a1a" font-weight="600">collapse 3: the mirror chain</text>
<rect x="60" y="326" width="800" height="520" rx="18" fill="none" stroke="#c8c8c8" stroke-width="2.5" stroke-dasharray="9,7"/>
<text x="1300" y="296" text-anchor="middle" font-size="30" fill="#1a1a1a" font-weight="600">grounded: selection between rooms</text>
<rect x="900" y="326" width="800" height="520" rx="18" fill="none" stroke="#c8c8c8" stroke-width="2.5" stroke-dasharray="9,7"/>
<text x="2140" y="296" text-anchor="middle" font-size="30" fill="#1a1a1a" font-weight="600">the limit: no last room</text>
<rect x="1740" y="326" width="800" height="520" rx="18" fill="none" stroke="#c8c8c8" stroke-width="2.5" stroke-dasharray="9,7"/>
<rect x="110" y="390" width="190" height="230" rx="12" fill="#f2f0e8" stroke="#8a8a80" stroke-width="2.5"/>
<text x="205" y="430" text-anchor="middle" font-size="22" fill="#3a3a3a">room t</text>
<circle cx="162" cy="498" r="26" fill="#e6e6fa" stroke="#5b5bd6" stroke-width="2.5"/>
<circle cx="248" cy="498" r="26" fill="#e6e6fa" stroke="#5b5bd6" stroke-width="2.5"/>
<circle cx="205" cy="568" r="26" fill="#e6e6fa" stroke="#5b5bd6" stroke-width="2.5"/>
<path d="M 302 505 L 360 505" stroke="#3a3a3a" stroke-width="3" marker-end="url(#ar)"/>
<text x="330" y="368" text-anchor="middle" font-size="22" fill="#9c2b1f">&#961; &#8776; 1</text>
<rect x="360" y="390" width="190" height="230" rx="12" fill="#f2f0e8" stroke="#8a8a80" stroke-width="2.5"/>
<text x="455" y="430" text-anchor="middle" font-size="22" fill="#3a3a3a">room t+1</text>
<circle cx="412" cy="498" r="26" fill="#e6e6fa" stroke="#5b5bd6" stroke-width="2.5"/>
<circle cx="498" cy="498" r="26" fill="#e6e6fa" stroke="#5b5bd6" stroke-width="2.5"/>
<circle cx="455" cy="568" r="26" fill="#e6e6fa" stroke="#5b5bd6" stroke-width="2.5"/>
<path d="M 552 505 L 610 505" stroke="#3a3a3a" stroke-width="3" marker-end="url(#ar)"/>
<text x="580" y="368" text-anchor="middle" font-size="22" fill="#9c2b1f">&#961; &#8776; 1</text>
<rect x="610" y="390" width="190" height="230" rx="12" fill="#f2f0e8" stroke="#8a8a80" stroke-width="2.5"/>
<text x="705" y="430" text-anchor="middle" font-size="22" fill="#3a3a3a">room t+2</text>
<circle cx="662" cy="498" r="26" fill="#e6e6fa" stroke="#5b5bd6" stroke-width="2.5"/>
<circle cx="748" cy="498" r="26" fill="#e6e6fa" stroke="#5b5bd6" stroke-width="2.5"/>
<circle cx="705" cy="568" r="26" fill="#e6e6fa" stroke="#5b5bd6" stroke-width="2.5"/>
<text x="460" y="732" text-anchor="middle" font-size="22" fill="#5f5f5f">same closure, handed along;</text>
<text x="460" y="762" text-anchor="middle" font-size="22" fill="#5f5f5f">agreement compounds, evidence does not</text>
<text x="460" y="794" text-anchor="middle" font-size="22" fill="#5f5f5f">blending: novelty swamped to the mean</text>
<rect x="950" y="390" width="190" height="230" rx="12" fill="#f2f0e8" stroke="#8a8a80" stroke-width="2.5"/>
<text x="1045" y="430" text-anchor="middle" font-size="22" fill="#3a3a3a">room t</text>
<circle cx="1002" cy="498" r="26" fill="#e6e6fa" stroke="#5b5bd6" stroke-width="2.5"/>
<circle cx="1088" cy="498" r="26" fill="#e6e6fa" stroke="#5b5bd6" stroke-width="2.5"/>
<circle cx="1045" cy="568" r="26" fill="#e6e6fa" stroke="#5b5bd6" stroke-width="2.5"/>
<text x="1170" y="368" text-anchor="middle" font-size="22" fill="#9c2b1f">R_t</text>
<text x="1170" y="472" text-anchor="middle" font-size="21" fill="#0f6b4a">h&#178;</text>
<path d="M 1170 620 L 1170 525" stroke="#0f6b4a" stroke-width="3" marker-end="url(#arG)"/>
<rect x="1080" y="625" width="180" height="62" rx="10" fill="#e2f2ec" stroke="#0f6b4a" stroke-width="2.5"/>
<text x="1170" y="665" text-anchor="middle" font-size="22" fill="#0f6b4a">ground</text>
<rect x="1200" y="390" width="190" height="230" rx="12" fill="#f2f0e8" stroke="#8a8a80" stroke-width="2.5"/>
<text x="1295" y="430" text-anchor="middle" font-size="22" fill="#3a3a3a">room t+1</text>
<circle cx="1252" cy="498" r="26" fill="#dff0e8" stroke="#0f6b4a" stroke-width="2.5"/>
<circle cx="1338" cy="498" r="26" fill="#e6e6fa" stroke="#5b5bd6" stroke-width="2.5"/>
<circle cx="1295" cy="568" r="26" fill="#dff0e8" stroke="#0f6b4a" stroke-width="2.5"/>
<text x="1420" y="368" text-anchor="middle" font-size="22" fill="#9c2b1f">R_t+1</text>
<text x="1420" y="472" text-anchor="middle" font-size="21" fill="#0f6b4a">h&#178;</text>
<path d="M 1420 620 L 1420 525" stroke="#0f6b4a" stroke-width="3" marker-end="url(#arG)"/>
<rect x="1330" y="625" width="180" height="62" rx="10" fill="#e2f2ec" stroke="#0f6b4a" stroke-width="2.5"/>
<text x="1420" y="665" text-anchor="middle" font-size="22" fill="#0f6b4a">ground</text>
<rect x="1450" y="390" width="190" height="230" rx="12" fill="#f2f0e8" stroke="#8a8a80" stroke-width="2.5"/>
<text x="1545" y="430" text-anchor="middle" font-size="22" fill="#3a3a3a">room t+2</text>
<circle cx="1502" cy="498" r="26" fill="#f7dcd6" stroke="#9c2b1f" stroke-width="2.5"/>
<circle cx="1588" cy="498" r="26" fill="#dff0e8" stroke="#0f6b4a" stroke-width="2.5"/>
<circle cx="1545" cy="568" r="26" fill="#e6e6fa" stroke="#5b5bd6" stroke-width="2.5"/>
<text x="1300" y="742" text-anchor="middle" font-size="22" fill="#5f5f5f">low &#961; between rooms; the next room is picked</text>
<text x="1300" y="772" text-anchor="middle" font-size="22" fill="#5f5f5f">against the residual the last one surfaced</text>
<text x="1300" y="806" text-anchor="middle" font-size="22" fill="#0f6b4a">progress per handoff: R = h&#178; &#215; S</text>
<line x1="1830" y1="420" x2="2420" y2="420" stroke="#0f6b4a" stroke-width="3.5" stroke-dasharray="14,9"/>
<text x="1830" y="398" font-size="24" fill="#0f6b4a">reality</text>







<text x="2460" y="456" font-size="21" fill="#5f5f5f">gap &gt; 0</text>
<text x="2140" y="760" text-anchor="middle" font-size="22" fill="#5b5bd6">what the chain can reach</text>
<text x="2140" y="792" text-anchor="middle" font-size="22" fill="#5f5f5f">every room closes some of the gap;</text>
<text x="2140" y="822" text-anchor="middle" font-size="22" fill="#5f5f5f">no finite number of them ever arrives</text>
<text x="460"  y="898" text-anchor="middle" font-size="26" fill="#9c2b1f">&#8594; one long room: motion, no progress</text>
<text x="1300" y="898" text-anchor="middle" font-size="26" fill="#0f6b4a">&#8594; variation inside, selection between</text>
<text x="2140" y="898" text-anchor="middle" font-size="26" fill="#3a3a9e">&#8594; the truth is where the schedule is heading</text>

<line x1="200" y1="946" x2="2400" y2="946" stroke="#dcdcdc" stroke-width="2"/>
<text x="200" y="998" font-size="28" fill="#1a1a1a" font-weight="700">A room&#8217;s agreement is variation, not a verdict. Selection between rooms is where the ground votes.</text>
<text x="240" y="1034" font-size="23" fill="#2b2b2b" font-weight="400" font-style="italic">A chain of mirrors is one long room. The next room must differ from the last, and match the residual it surfaced.</text>
<rect x="210" y="1015" width="4" height="29" rx="2" fill="#c8c8c8"/>
<text x="200" y="1068" font-size="22" fill="#454545" font-weight="400">Progress per handoff has two factors. Zero either and the chain runs in place:</text>
<text x="244" y="1102" font-size="22" fill="#454545" font-weight="400">the bracket&#8217;s fidelity across the handoff</text>
<circle cx="220" cy="1095" r="4.5" fill="#8a8a80"/>
<text x="244" y="1136" font-size="22" fill="#454545" font-weight="400">the ground&#8217;s pressure on the room</text>
<circle cx="220" cy="1129" r="4.5" fill="#8a8a80"/>
<text x="200" y="1202" font-size="23" fill="#1a1a1a" font-weight="600">The room is summoned by the residual rather than composed.</text>
<text x="200" y="1236" font-size="22" fill="#454545" font-weight="400">And the pool it is drawn from must be unauthored. See Figures 10 and 11.</text>
<text x="200" y="1290" font-size="19" fill="#8a8a80" font-weight="400">The chain approaches the truth only as the world runs out of ways to refuse it. Which means the next room you book is the direction you travel, and booking a room like the last one is how a chain stops travelling at all.</text>

