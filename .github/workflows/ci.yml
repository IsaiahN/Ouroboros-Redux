# CI for Ouroboros-Redux.
#
# HISTORY, kept deliberately: until 2026-08-18 this file was inherited boilerplate headed
# "BitterTruth-AI". It triggered only on [main, master] while every commit of this project
# has been on v4-cold; every check ended in `|| echo` or carried continue-on-error; it
# excluded manual_tools/ (where the orphan auditor lives); and it invoked neither the
# wiring registry test nor the coverage diff. It was last touched 2026-02-01 by a29cb28 --
# the same commit that severed 55 tables from their only writer. THE_LADDER rung 0c called
# this a "CI gate" for weeks. It was not one. See HISTORY_TRACE.md sections 5 and 6.
#
# RULED BY ISAIAH 2026-08-18: enforce the consumption sweep here, so rung 0d stops being
# something the seat has to remember to read.

name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install vulture pytest ruff
          pip install python-dotenv aiohttp numpy pandas

      # ── BLOCKING. These fail the build. That is the whole point of the ruling. ──

      - name: 'RUNG 0d - consumption sweep (BLOCKING)'
        run: python tools/consumption_sweep.py --strict

      - name: 'RUNG 0c - wiring registry (BLOCKING)'
        run: pytest tests/gate/test_wiring_registry.py -q

      - name: 'OOD lint - no game-id leakage (BLOCKING)'
        run: python tools/ood_lint.py

      - name: 'ruff (BLOCKING)'
        run: ruff check .

      - name: 'gate suite (BLOCKING)'
        run: pytest tests/gate -q

      # ── ADVISORY. Vulture cannot see past __init__ re-exports -- that blind spot hid
      # sequence_miner.py for months (WIRING_REGISTRY.md). It stays non-blocking BECAUSE
      # it is known-incomplete, and manual_tools/ is NO LONGER EXCLUDED: excluding the
      # directory that holds the orphan auditor is how the auditor itself went 195 days
      # unnoticed as an orphan.
      - name: 'vulture (ADVISORY - known blind spot on re-exports)'
        continue-on-error: true
        run: |
          vulture engines/ cognitive_loop.py cognitive_game_player.py manual_tools/ \
            --min-confidence 80 --ignore-names "_*" --exclude "deprecated/,tests/"
